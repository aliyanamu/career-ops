name: Build & deploy tracker

on:
  push:
    branches: [main]
    paths:
      - 'tracker/**'
      - '.github/workflows/build-tracker.yml'
  workflow_dispatch:

# Pages source must be set to "GitHub Actions" in repo Settings → Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tracker/package-lock.json
      - run: npm ci
        working-directory: tracker
      - run: npm run build
        working-directory: tracker
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
