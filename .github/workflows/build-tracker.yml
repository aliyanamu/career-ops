name: Build tracker

on:
  push:
    branches: [main]
    paths:
      - 'tracker/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tracker/package-lock.json
      - run: npm ci
        working-directory: tracker
      - run: npm run build
        working-directory: tracker
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'build: update docs from tracker source'
          file_pattern: 'docs/**'
